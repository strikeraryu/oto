[package]
name = "oto"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Synchronized audio for Macs on your local network"
license = "MIT"
build = "build.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
if-addrs = "0.13"
# Ratatui's newer macro dependency requires Rust 1.88; retain our 1.85 minimum.
instability = "=0.3.7"
libc = "0.2"
mdns-sd = "0.13"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
